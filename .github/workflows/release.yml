name: release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, such as v0.7.0 or v0.7.0-rc.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Go vulnerabilities
        env:
          GOWORK: off
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -format=text -scan=symbol -test ./...

  release:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: release-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.release-token.outputs.token }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::releases must run from main"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(rc|alpha|beta|dev)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::invalid release version: $VERSION"
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi
          source_version=$(awk -F'"' '/^const Version =/ {print $2; exit}' ./*.go)
          if [ "v$source_version" != "$VERSION" ]; then
            echo "::error::source Version is v$source_version, not $VERSION"
            exit 1
          fi
      - name: Check API compatibility
        run: GOWORK=off ./scripts/check-api-compat.sh
      - name: Check licenses
        run: GOWORK=off ./scripts/check-licenses.sh
      - name: Check notices
        run: GOWORK=off ./scripts/check-notices.sh
      - name: Check UI reference bundle
        run: GOWORK=off go run ./internal/cmd/syncskills --check
      - name: Vet
        run: GOWORK=off go vet ./...
      - name: Test
        run: GOWORK=off go test -count=1 ./...
      - name: Build
        run: GOWORK=off go build ./...
      - name: Executor image and permission gate
        env:
          GOWORK: off
          JSEXEC_DOCKER_TEST: '1'
          JSEXEC_DENO_PROBE: '1'
        run: go test -count=1 -timeout=5m ./jsexec
      - name: Create tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" "$GITHUB_SHA" -m "$VERSION"
          git push origin "refs/tags/$VERSION"
