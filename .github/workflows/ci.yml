name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check API compatibility
        run: GOWORK=off ./scripts/check-api-compat.sh
      - name: Check licenses
        run: ./scripts/check-licenses.sh
      - name: Check notices
        run: ./scripts/check-notices.sh
      - name: Check UI reference bundle
        run: GOWORK=off go run ./internal/cmd/syncskills --check
      - name: Vet
        run: GOWORK=off go vet ./...
      - name: Cross-compile connector SDK
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 GOWORK=off go build ./connector/...
          done
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 GOWORK=off go build ./connector/...
      - name: Cross-compile SDK for macOS
        run: |
          for arch in amd64 arm64; do
            GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 GOWORK=off go build ./...
          done
      - name: Test
        run: GOWORK=off go test -count=1 ./...

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: GOWORK=off go test -count=1 ./connector/...
